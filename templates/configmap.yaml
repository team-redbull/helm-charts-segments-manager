apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "segments-manager.fullname" . }}
  labels:
    {{- include "segments-manager.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  # Site configuration
  SITE_PREFIXES: {{ .Values.config.sitePrefixes | quote }}

  # Server configuration
  SERVER_HOST: {{ .Values.config.serverHost | quote }}
  SERVER_PORT: {{ .Values.config.serverPort | quote }}

  # Logging configuration
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FILE: {{ .Values.config.logFile | quote }}

  # MongoDB configuration (URL itself comes from the Secret)
  MONGODB_DB_NAME: {{ .Values.mongodb.dbName | quote }}
  MONGODB_TLS_INSECURE: {{ .Values.mongodb.tlsInsecure | quote }}

  # No WORKFLOWS_API_URL: segments-manager makes no outbound calls. It used to
  # POST to the workflows API on every segment creation to start the
  # segment-connectivity workflow; that workflow is now triggered directly by
  # its caller and calls POST /api/segments here as its own first step.
